name: Validate

# Runs on every pull request (including each new push to the PR branch — the
# `synchronize` event) and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate project entries
        run: python3 scripts/validate.py
