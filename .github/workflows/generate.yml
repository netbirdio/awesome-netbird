name: Generate

# Regenerates README.md from the data in data/projects/ and opens (or updates)
# a single rolling pull request with the result. This never pushes to main, so
# it works regardless of branch protection. A maintainer merges the PR.
#
# dist/projects.json is NOT built here — it is produced and published as a
# release asset by release.yml. Contributors only ever edit YAML.
on:
  push:
    branches: [main]
    paths:
      - "data/projects/**"
      - "scripts/gen-readme.py"
      - ".github/workflows/generate.yml"

# Serialize runs so two quick merges don't race to update the PR branch.
concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate README
        run: python3 scripts/gen-readme.py

      - name: Open or update the README pull request
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: README.md
          branch: chore/regenerate-readme
          delete-branch: true
          commit-message: "chore: regenerate README from data/projects"
          title: "chore: regenerate README"
          body: |
            Automated update of `README.md` to match the current entries in
            `data/projects/`. Generated by `scripts/gen-readme.py` via the
            Generate workflow. Merge to publish the refreshed list.
