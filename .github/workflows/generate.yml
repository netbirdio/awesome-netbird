name: Generate

# Regenerates the build outputs (README.md and dist/projects.json) from the
# data in data/projects/ and opens (or updates) a single rolling pull request
# with the result. This never pushes to main, so it works regardless of branch
# protection. A maintainer merges the PR to publish.
#
# dist/projects.json is committed so the site can fetch it at build time
# (e.g. raw.githubusercontent.com/<org>/awesome-netbird/main/dist/projects.json).
# Contributors only ever edit YAML.
on:
  push:
    branches: [main]
    paths:
      - "data/projects/**"
      - "scripts/gen-readme.py"
      - "scripts/build.py"
      - ".github/workflows/generate.yml"

# Serialize runs so two quick merges don't race to update the PR branch.
concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate build outputs
        run: |
          python3 scripts/gen-readme.py
          python3 scripts/build.py

      - name: Open or update the generated-files pull request
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            README.md
            dist/projects.json
          branch: chore/regenerate
          delete-branch: true
          commit-message: "chore: regenerate README and dist from data/projects"
          title: "chore: regenerate README and dist"
          body: |
            Automated update of `README.md` and `dist/projects.json` to match the
            current entries in `data/projects/`. Generated by `scripts/gen-readme.py`
            and `scripts/build.py` via the Generate workflow. Merge to publish.
