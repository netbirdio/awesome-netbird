name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
#
# This rebuilds dist/projects.json from the data at that tag, validates it, and
# attaches it to a GitHub Release. The site can then pin to a stable URL:
#   https://github.com/<org>/awesome-netbird/releases/download/v1.0.0/projects.json
# or always track the newest release:
#   https://github.com/<org>/awesome-netbird/releases/latest/download/projects.json
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      # Never ship a release built from invalid data.
      - name: Validate project entries
        run: python3 scripts/validate.py

      # Rebuild from source rather than trusting the committed copy, so the
      # asset always matches the data at this tag.
      - name: Build release artifact
        run: python3 scripts/build.py

      # Idempotent: if the release for this tag already exists (re-run, moved
      # tag), update its asset instead of failing on create.
      - name: Create or update release and asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists; updating asset."
            gh release upload "${GITHUB_REF_NAME}" dist/projects.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/projects.json \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
