name: Magisk NetBird
description: >-
  A Magisk module that packages the NetBird client for Android devices,
  with binaries for arm64-v8a, armeabi-v7a, and x86_64. It includes service
  controls and a KernelSU WebUI for managing the client.
author: ahsaboy
category: Apps
